[package]
name = "sat-playground"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = true
strip = false

[lib]
name = "clsat"
crate-type = ["cdylib","rlib"]

[dependencies]
ctrlc = "3.5.2"
fastbit = "0.11.1"
indexmap = "2.13.0"
pyo3 = {version =  "0.28.3", features = ["macros", "experimental-inspect"]}
rand = "0.10.1"
ultragraph = "0.8.15"

[build-dependencies]
pyo3-build-config = "0.28.3"

[features]
extension-module = ["pyo3/extension-module"]
# Keep Rust test binaries linked against libpython. Maturin enables
# `extension-module` explicitly when building the Python extension.
default = []
